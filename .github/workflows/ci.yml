name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Unit, guardrail, regression and held-out gates (offline, keyword classifier)
        run: python -m pytest
      - name: Reproduce the dev evaluation
        run: python src/eval_harness.py ci on --set dev --out /tmp/eval
